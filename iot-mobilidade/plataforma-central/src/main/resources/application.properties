server.port=8080
spring.application.name=plataforma-central

# Banco de dados (PostgreSQL + TimescaleDB)
spring.datasource.url=jdbc:postgresql://localhost:5433/iot
spring.datasource.username=iot
spring.datasource.password=iot
spring.sql.init.mode=always

# Broker MQTT
plataforma.mqtt.habilitado=true
plataforma.mqtt.url=tcp://localhost:1883

# Regras da plataforma (configuração, não código)
plataforma.limite-atraso-s=30
plataforma.nivel.fluido-min=30
plataforma.nivel.congestionado-max=15
plataforma.painel.validade-s=300

# Observabilidade
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Documentação da API
springdoc.swagger-ui.path=/swagger-ui.html
