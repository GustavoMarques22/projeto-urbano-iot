server.port=8081
spring.application.name=no-borda

# Fila persistente em SQLite (modo WAL: uma queda de energia não corrompe a fila)
spring.datasource.url=jdbc:sqlite:./data/borda.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Identidade do nó e ligação com a central
borda.id=borda-periferia-norte
borda.token=borda-demo-token
borda.central-url=http://localhost:8080
borda.versao=1.0.0
borda.sync-intervalo-ms=5000
borda.lote-max=500

# MQTT local da propriedade/região (broker próprio do nó)
borda.mqtt.habilitado=true
borda.mqtt.url=tcp://localhost:1884
